services:
  # ===== BACKEND SERVICES =====
  
  web:
    build:
      context: ./mail_backend  # ← Важно: путь к Django-приложению
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./mail_backend:/app  # ← Монтируем именно mail_backend
    ports:
      - "8000:8000"
    environment:
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - app-network

  celery_worker:
    build:
      context: ./mail_backend
      dockerfile: Dockerfile
    command: celery -A mail_client worker --loglevel=info
    volumes:
      - ./mail_backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/1
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - app-network

  celery_beat:
    build:
      context: ./mail_backend
      dockerfile: Dockerfile
    command: celery -A mail_client beat --loglevel=info
    volumes:
      - ./mail_backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/2
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    networks:
      - app-network

  # ===== DATABASE & CACHE =====
  
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mail_client
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mail_client"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  # ===== FRONTEND: DEV MODE =====
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile  # ← Node.js для разработки
    volumes:
      - ./frontend:/app
      - /app/node_modules  # ← Не перезаписывать node_modules из хоста
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://web:8000/api  # ← Внутренний DNS Docker
    depends_on:
      - web
    networks:
      - app-network

  # ===== NGINX: PROD MODE =====
  
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod  # ← Multi-stage с nginx
    ports:
      - "80:80"
    volumes:
      - ./frontend/dist:/usr/share/nginx/html:ro  # ← Сборка монтируется
    depends_on:
      - web
    networks:
      - app-network
    restart: unless-stopped

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  redis_data: