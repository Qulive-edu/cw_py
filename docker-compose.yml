services:
  # ===== BACKEND SERVICES =====
  
  web:
    build:
      context: ./mail_backend
      dockerfile: Dockerfile
    command: sh -c "python manage.py migrate && python manage.py runserver 0.0.0.0:8000"
    volumes:
      - ./mail_backend:/app
    ports:
      - "8000:8000"
    environment:
      # Django
      - DJANGO_SECRET_KEY=your-secret-key-change-in-prod
      - DJANGO_DEBUG=True
      - DJANGO_ALLOWED_HOSTS=localhost,127.0.0.1,web,frontend
      # Database
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=600
      - DB_CONN_HEALTH_CHECKS=True
      # Redis
      - REDIS_URL=redis://redis:6379/0
      - REDIS_MAX_CONNECTIONS=50
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Cryptography
      - FERNET_KEY=${FERNET_KEY:-}  # Задайте через .env или сгенерируйте
      # CORS
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://frontend:3000
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery_worker:
    build:
      context: ./mail_backend
      dockerfile: Dockerfile
    command: celery -A mail_client worker --loglevel=info
    volumes:
      - ./mail_backend:/app
    environment:
      # Database
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - DB_PORT=5432
      - DB_CONN_MAX_AGE=600
      - DB_CONN_HEALTH_CHECKS=True
      # Redis
      - REDIS_URL=redis://redis:6379/0
      # Celery
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      # Cryptography - ВАЖНО: тот же ключ, что и у web!
      - FERNET_KEY=${FERNET_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  celery_beat:
    build:
      context: ./mail_backend
      dockerfile: Dockerfile
    command: celery -A mail_client beat --loglevel=info
    volumes:
      - ./mail_backend:/app
    environment:
      - DB_HOST=db
      - DB_NAME=mail_client
      - DB_USER=postgres
      - DB_PASSWORD=postgres
      - REDIS_URL=redis://redis:6379/0
      - CELERY_BROKER_URL=redis://redis:6379/1
      - CELERY_RESULT_BACKEND=redis://redis:6379/2
      - FERNET_KEY=${FERNET_KEY:-}
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    restart: unless-stopped

  # ===== DATABASE & CACHE =====
  
  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: mail_client
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d mail_client"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ===== FRONTEND: DEV MODE =====
  
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    environment:
      - VITE_API_BASE_URL=http://web:8000/api
    depends_on:
      - web
    restart: unless-stopped

  # ===== NGINX: PROD MODE =====
  
  nginx:
    build:
      context: ./frontend
      dockerfile: Dockerfile.prod
    ports:
      - "80:80"

volumes:
  postgres_data:
  redis_data: